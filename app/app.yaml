command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
env:
  # SQL warehouse (resource: sql-warehouse) — leituras pontuais de system tables
  - name: "WAREHOUSE_ID"
    valueFrom: "sql-warehouse"
  # schema v2 no Lakebase (o resource "lakebase" injeta PGHOST/PGUSER/PGDATABASE)
  - name: "LAKEGUARD_PG_SCHEMA"
    value: "lg"
  # job de inventário 360 e regras (bundle na raiz do repo)
  - name: "INVENTORY_JOB_ID"
    value: "421974903123513"
  # conta (rule sets de group manager)
  - name: "LAKEGUARD_ACCOUNT_ID"
    value: "05d08df7-ae03-43ad-bbae-14babb530ec0"
  # admins garantidos do próprio app (além da tabela app_roles)
  - name: "LAKEGUARD_BOOTSTRAP_ADMINS"
    value: "fernando.custodio@databricks.com"
