<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakeguard</title>
    <script>
      // Aplica o tema salvo antes do render (evita flash). Default: dark.
      try {
        var t = localStorage.getItem("lakeguard-theme");
        document.documentElement.classList.toggle("dark", t !== "light");
      } catch (e) { document.documentElement.classList.add("dark"); }
    </script>
  </head>
  <body class="bg-bg text-text min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
