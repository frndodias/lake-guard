# Lakeguard — bundle do job de inventário 360 e regras.
# O app (app/) é deployado com `databricks apps deploy` (ver setup/provision.md).
bundle:
  name: lakeguard

sync:
  exclude:
    - app/frontend/**
    - setup/**
    - sql/**

targets:
  fevm-fc:
    default: true
    workspace:
      host: https://fevm-fc.cloud.databricks.com

resources:
  jobs:
    lakeguard_inventory:
      name: "[Lakeguard] Inventário 360 e regras"
      description: "Coleta identidades, GRANTs e uso; avalia regras; expira acessos temporários."
      tasks:
        - task_key: inventory
          spark_python_task:
            python_file: ./jobs/inventory/run.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - psycopg2-binary
              - databricks-sdk>=0.96.0
              - fastapi>=0.115.0
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      queue:
        enabled: true
